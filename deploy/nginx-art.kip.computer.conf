server {
    # Replace <TAILNET_IP> before enabling this vhost.
    listen <TAILNET_IP>:443 ssl http2;
    server_name art.kip.computer;
    # Install the tailnet-only certificate before enabling this vhost.
    ssl_certificate /etc/letsencrypt/live/art.kip.computer/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/art.kip.computer/privkey.pem;
    location / {
        proxy_pass http://127.0.0.1:8033;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
